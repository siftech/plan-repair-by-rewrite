name: Test

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

env:
  I_AGREE_TO_ALLEGRO_EXPRESS_LICENSE: "yes"
  QUICKLISP_ADD_TO_INIT_FILE: "true"

jobs:
  test-plan-repair-by-rewrite:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        l: [sbcl, ccl, allegro11express]
        IMAGE_TAG: [latest]

    container:
      image: rpgoldman/${{ matrix.l }}:${{ matrix.IMAGE_TAG }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Quicklisp
        run: install-quicklisp

      - name: Download ASDF
        run: |
          mkdir -p /asdf
          cd /asdf
          wget https://asdf.common-lisp.dev/archives/asdf.lisp

      - name: Run tests
        shell: bash
        run: |
          case "${{ matrix.l }}" in
            sbcl)
              sbcl --non-interactive \
                --load /asdf/asdf.lisp \
                --load "$GITHUB_WORKSPACE/do-test.lisp" \
                --eval "(uiop:quit 0)"
              ;;

            allegro11express)
              alisp \
                -L /asdf/asdf.lisp \
                -L "$GITHUB_WORKSPACE/do-test.lisp" \
                --kill
              ;;

            ccl)
              ccl --batch \
                --load /asdf/asdf.lisp \
                --load "$GITHUB_WORKSPACE/do-test.lisp" \
                --eval "(uiop:quit 0)"
              ;;
          esac